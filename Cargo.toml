[package]
name = "cxcom"
version = "0.1.0"
edition = "2021"
description = "CXCOM serial/network debugger (Rust + egui + OpenGL)"
build = "build.rs"
license = "CC-BY-NC-ND-4.0"

[[bin]]
name = "CXCOM"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["glow", "x11", "wayland"] }
serialport = { version = "=4.9.0", default-features = false }
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_ProcessStatus",
    "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
encoding_rs = "0.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = false
debug = false

# macOS .app 打包元数据（cargo bundle 使用；Windows/Linux 构建不受影响）
[package.metadata.bundle]
name = "CXCOM"
identifier = "com.cx693.cxcom"
icon = ["icon/tu.png"]
version = "0.1.0"
category = "public.app-category.developer-tools"
short_description = "串口 / 网络调试器"
long_description = """
CXCOM 串口/网络调试器：串口与 TCP/UDP 收发、GB2312/UTF-8 切换、HEX、
时间戳分包、定时发送、串口绘图与快捷指令。
"""
copyright = "CC-BY-NC-ND-4.0"
